[pytest]
pythonpath = .
asyncio_mode = auto
testpaths = tests
# Deprecation warnings raised inside third-party libraries, not in this project's code.
# Each is matched by its exact message, so any new warning still shows.
filterwarnings =
    ignore:datetime.datetime.utcnow\(\) is deprecated:DeprecationWarning:jose.*
    ignore:Accessing argon2.__version__ is deprecated:DeprecationWarning:passlib.*
    ignore:'crypt' is deprecated:DeprecationWarning:passlib.*
    ignore:The 'strip_cdata' option of HTMLParser\(\) has never done anything:DeprecationWarning:bs4.*
