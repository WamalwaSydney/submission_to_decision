# GitHub Actions — Legislative Sync

name: Legislative Data Sync

on:
  push:
    branches: [main]
    # Optional: only run when backend or the workflow itself changes.
    # Delete this paths block to run on every push to main.
    paths:
      - 'backend/**'
      - '.github/workflows/sync.yml'
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

# Prevents a push and the nightly run from syncing at the same time
concurrency:
  group: legislative-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Install PDF text extractor
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Verify script path
        working-directory: backend
        run: ls -la app app/scripts

      - name: Fetch legislative data
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONPATH: ${{ github.workspace }}/backend
        run: python -m app.scripts.sync_legislation

      - name: Notify on failure
        if: failure()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Legislative Sync Failed',
              body: `The legislative data sync failed (trigger: ${context.eventName}).\n\nRun: ${runUrl}`
            });