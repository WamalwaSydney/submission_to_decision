# GitHub Actions — Scheduled Legislative Sync

name: Legislative Data Sync

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Install PDF text extractor
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      
      - name: Fetch legislative data
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd backend
          python -m app.scripts.sync_legislation
      
      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Legislative Sync Failed',
              body: 'The scheduled legislative data sync failed. Check the workflow run for details.'
            })
