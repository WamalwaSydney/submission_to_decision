# GitHub Actions — Legislative Sync

name: Legislative Data Sync

on:
  push:
    branches: [main]
    # Optional: only run when backend or the workflow itself changes.
    # Delete this paths block to run on every push to main.
    paths:
      - 'backend/**'
      - '.github/workflows/sync.yml'
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

# Prevents a push and the nightly run from syncing at the same time
concurrency:
  group: legislative-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Install PDF text extractor
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Verify script path
        working-directory: backend
        run: ls -la app app/scripts

      - name: Fetch legislative data
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONPATH: ${{ github.workspace }}/backend
        run: python -m app.scripts.sync_legislation

      - name: Install OCR
        run: sudo apt-get install -y tesseract-ocr

      # Reads every report linked to a bill (including large scans), proposes matches and seals report records.
      # The runner has far more time and memory than the API server, so the OCR limits are set high here.
      - name: Read committee reports
        working-directory: backend
        timeout-minutes: 320
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MIN_INTERVAL_SECONDS: '4.2'  # free tier: at most 15 Gemini requests a minute
          PYTHONPATH: ${{ github.workspace }}/backend
          OCR_TOTAL_TIMEOUT: '3600'
          MAX_OCR_PAGES: '500'
          OCR_WORKERS: '4'  # the runner's 4 cores: four pages at once
          TESSERACT_TIMEOUT: '180'
          PDF_RENDER_TIMEOUT: '60'
          READ_BUDGET_MINUTES: '300'
        run: python -m app.scripts.read_reports

      # The AI reading lists every submission a report records (who, what, the committee's decision and reason) and
      # seals each into the hash chain. Only reports not yet analysed; without a Gemini key, or on a quota
      # error, the step stops but does not fail the run (the rest are analysed next night).
      - name: Analyse committee reports
        continue-on-error: true
        working-directory: backend
        timeout-minutes: 60
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MIN_INTERVAL_SECONDS: '4.2'  # free tier: at most 15 Gemini requests a minute
          PYTHONPATH: ${{ github.workspace }}/backend
          # Same model as matching (gemini-3.5-flash-lite). It stops after this many requests a night, so it leaves the
          # model's free daily quota for matching citizens' submissions; the remaining reports are analysed next night.
          GEMINI_MAX_REQUESTS: '400'
        run: python -m app.scripts.analyse_reports --all

      - name: Notify on failure
        if: failure()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Legislative Sync Failed',
              body: `The legislative data sync failed (trigger: ${context.eventName}).\n\nRun: ${runUrl}`
            });