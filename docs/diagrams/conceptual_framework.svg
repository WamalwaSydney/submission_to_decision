<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="1400" height="760" fill="#ffffff"/>

  <!-- ===================== Problem (context) ===================== -->
  <text x="50" y="44" font-size="20" font-weight="bold" fill="#111">Problem (context)</text>
  <g font-size="15" fill="#111" text-anchor="middle">
    <rect x="272" y="62" width="190" height="96" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <text x="367" y="94"><tspan x="367">No verifiable record</tspan><tspan x="367" dy="19">that a view was</tspan><tspan x="367" dy="19">submitted</tspan></text>

    <rect x="494" y="62" width="190" height="96" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <text x="589" y="94"><tspan x="589">Submissions and</tspan><tspan x="589" dy="19">committee reports travel</tspan><tspan x="589" dy="19">in separate channels</tspan></text>

    <rect x="716" y="62" width="190" height="96" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <text x="811" y="94"><tspan x="811">No link between a view</tspan><tspan x="811" dy="19">and its documented</tspan><tspan x="811" dy="19">treatment</tspan></text>

    <rect x="1009" y="62" width="270" height="96" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <text x="1144" y="94"><tspan x="1144">Participation that citizens,</tspan><tspan x="1144" dy="19">CSOs and courts cannot</tspan><tspan x="1144" dy="19">verify</tspan></text>
  </g>
  <g stroke="#333" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="462" y1="110" x2="492" y2="110"/>
    <line x1="684" y1="110" x2="714" y2="110"/>
    <line x1="906" y1="110" x2="1007" y2="110"/>
  </g>

  <!-- Each problem points to the part of the platform that answers it -->
  <g stroke="#333" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="367" y1="158" x2="367" y2="268"/>
    <line x1="589" y1="158" x2="589" y2="268"/>
    <line x1="811" y1="158" x2="811" y2="268"/>
    <line x1="1110" y1="158" x2="1050" y2="268"/>
    <line x1="1178" y1="158" x2="1238" y2="268"/>
  </g>

  <!-- ===================== Intervention (independent variable) ===================== -->
  <text x="50" y="206" font-size="19" font-weight="bold" fill="#111"><tspan x="50">Intervention</tspan><tspan x="50" dy="23">(independent variable):</tspan><tspan x="50" dy="23">the platform</tspan></text>
  <g font-size="15" fill="#111" text-anchor="middle">
    <rect x="50" y="270" width="190" height="104" rx="6" fill="#f2f2f2" stroke="#333" stroke-width="1.5"/>
    <text x="145" y="306"><tspan x="145">Call-for-views</tspan><tspan x="145" dy="19">tracking (when a bill</tspan><tspan x="145" dy="19">accepts views)</tspan></text>

    <rect x="272" y="270" width="190" height="104" rx="6" fill="#f2f2f2" stroke="#333" stroke-width="1.5"/>
    <text x="367" y="315"><tspan x="367">Hash-chained</tspan><tspan x="367" dy="19">participation receipt</tspan></text>

    <rect x="494" y="270" width="190" height="104" rx="6" fill="#f2f2f2" stroke="#333" stroke-width="1.5"/>
    <text x="589" y="296"><tspan x="589">Committee-report</tspan><tspan x="589" dy="19">ingestion (text + OCR)</tspan><tspan x="589" dy="19">and AI reading of</tspan><tspan x="589" dy="19">who said what</tspan></text>

    <rect x="716" y="270" width="190" height="104" rx="6" fill="#f2f2f2" stroke="#333" stroke-width="1.5"/>
    <text x="811" y="315"><tspan x="811">Proposed match +</tspan><tspan x="811" dy="19">human review</tspan></text>

    <rect x="938" y="270" width="190" height="104" rx="6" fill="#f2f2f2" stroke="#333" stroke-width="1.5"/>
    <text x="1033" y="315"><tspan x="1033">Issue-level</tspan><tspan x="1033" dy="19">outcome view</tspan></text>

    <rect x="1160" y="270" width="190" height="104" rx="6" fill="#f2f2f2" stroke="#333" stroke-width="1.5"/>
    <text x="1255" y="296"><tspan x="1255">House and Act</tspan><tspan x="1255" dy="19">tracing (Hansard</tspan><tspan x="1255" dy="19">decision, final Act)</tspan></text>
  </g>
  <g stroke="#333" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="240" y1="322" x2="270" y2="322"/>
    <line x1="462" y1="322" x2="492" y2="322"/>
    <line x1="684" y1="322" x2="714" y2="322"/>
    <line x1="906" y1="322" x2="936" y2="322"/>
    <line x1="1128" y1="322" x2="1158" y2="322"/>
  </g>

  <!-- ===================== Cross-cutting conditions ===================== -->
  <rect x="50" y="418" width="1300" height="78" rx="8" fill="#fff" stroke="#333" stroke-width="1.5" stroke-dasharray="7 5"/>
  <g font-size="15" fill="#111" text-anchor="middle">
    <text x="700" y="448">Cross-cutting conditions: moderation · privacy and data minimisation · low-bandwidth and offline access</text>
    <text x="700" y="472">neutral status labels · disclosure of matching confidence · AI evidence checked against the source text</text>
  </g>
  <!-- The whole platform, together with the cross-cutting conditions, leads to the outcome -->
  <path d="M145,376 V390 H1255 V376" fill="none" stroke="#333" stroke-width="1.5"/>
  <line x1="700" y1="390" x2="700" y2="416" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="460" y1="496" x2="460" y2="566" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===================== Outcome and outside control ===================== -->
  <rect x="50" y="568" width="820" height="150" rx="6" fill="#e6e6e6" stroke="#333" stroke-width="1.8"/>
  <g font-size="16" fill="#111" text-anchor="middle">
    <text x="460" y="606" font-weight="bold">Expected outcome (dependent variable)</text>
    <text x="460" y="636"><tspan x="460">A verifiable, auditable trail from a citizen's submission</tspan><tspan x="460" dy="22">to the committee's documented decision, the House's decision</tspan><tspan x="460" dy="22">and the final Act</tspan></text>
  </g>

  <rect x="910" y="568" width="440" height="150" rx="6" fill="#fff" stroke="#333" stroke-width="1.5" stroke-dasharray="2 4"/>
  <g font-size="15" fill="#111" text-anchor="middle">
    <text x="1130" y="604" font-weight="bold">Outside the platform's control</text>
    <text x="1130" y="632"><tspan x="1130">institutional responsiveness</tspan><tspan x="1130" dy="20">quality and detail of committee reports</tspan><tspan x="1130" dy="20">availability of sources: Hansard copies</tspan><tspan x="1130" dy="20">(Mzalendo) and Act texts (Kenya Law)</tspan></text>
  </g>
</svg>
